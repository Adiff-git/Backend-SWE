name: Test Backend Service

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            main

permissions:
    contents: read

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
          - name: Checkout source code
            uses: actions/checkout@v7

          - name: Set up JDK 25
            uses: actions/setup-java@v6
            with:
                distribution: temurin
                java-version: 25

          - name: Run tests
            run: mvn -B -ntp clean verify
