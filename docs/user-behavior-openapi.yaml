openapi: 3.1.0
info:
  title: Backend-SWE Customer Behavior API
  version: 1.0.0
  description: Additive contract. Cross-user internal API is deliberately unavailable
    until service authentication is provisioned. See user-behavior-tracking.md.
security:
- bearerAuth: []
paths:
  /api/me/behavior/events:
    post:
      summary: Record intentional Customer interaction
      description: ROLE_USER excluding ROLE_ADMIN. No query parameters. Each intentional
        action gets a new clientEventId; retries reuse exact payload/key. Idempotency
        persists only while its raw event exists (up to 90 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientBehaviorEvent'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '200':
          description: Identical retry, no additional event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400': &id002
          description: Invalid payload, fields or parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id003
          description: Missing or invalid Bearer credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id004
          description: Wrong role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Product absent or not PUBLISHED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicting reuse of clientEventId
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/me/behavior:
    get:
      summary: Current Customer history
      description: ROLE_USER excluding ROLE_ADMIN. Owner is derived from JWT. Newest
        first by occurredAt DESC,id DESC; expired rows excluded even before cleanup.
        Unknown/duplicate query parameters rejected. Dates inclusive, ordered, not
        future, span <=90 days; older start clipped to cutoff. No cross-user parameter.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        description: Zero-based
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Bounded page size
      - name: eventType
        in: query
        required: false
        schema:
          type: string
          enum: &id006
          - PRODUCT_VIEW
          - SEARCH
          - PRODUCT_CLICK
          - WISHLIST_ADD
          - WISHLIST_REMOVE
        description: Optional type
      - name: from
        in: query
        required: false
        schema: &id001
          type: string
          format: date-time
        description: Default now minus 90 days
      - name: to
        in: query
        required: false
        schema: *id001
        description: Default now
      responses:
        '200':
          description: 'Owner history, Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorPage'
        '400': *id002
        '401': *id003
        '403': *id004
  /api/admin/behavior/overview:
    get:
      summary: Administrator aggregate metrics
      description: ROLE_ADMIN. Recorded events, not unique or proven physical human
        actions. Inclusive server-time windows. Top ten product lists sorted count
        DESC, UUID ASC. No user IDs or histories. Unknown/duplicate parameters rejected.
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 7
          - 30
          - 90
          default: 7
        description: Window ending at server now
      responses:
        '200':
          description: 'Aggregates, Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorOverview'
        '400': *id002
        '401': *id003
        '403': *id004
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClientBehaviorEvent:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - eventType
        - clientEventId
        - productId
        properties:
          clientEventId: &id005
            type: string
            format: uuid
          eventType:
            type: string
            const: PRODUCT_VIEW
          productId: *id005
          searchQuery:
            type: 'null'
          sourceContext:
            type: 'null'
      - type: object
        additionalProperties: false
        required:
        - eventType
        - clientEventId
        - searchQuery
        properties:
          clientEventId: *id005
          eventType:
            type: string
            const: SEARCH
          searchQuery:
            type: string
            minLength: 1
            maxLength: 256
            description: Nonblank searchable query, at most 16 tokens; existing Vietnamese
              normalization. Original retained for owner history and exact retries.
          productId:
            type: 'null'
          sourceContext:
            type: 'null'
      - type: object
        additionalProperties: false
        required:
        - eventType
        - clientEventId
        - productId
        properties:
          clientEventId: *id005
          eventType:
            type: string
            const: PRODUCT_CLICK
          productId: *id005
          sourceContext:
            type:
            - string
            - 'null'
            enum:
            - SEARCH_RESULTS
            - CATEGORY_LIST
            - PRODUCT_LIST
            - OTHER
            - null
          searchQuery:
            type: 'null'
      description: Nullable optional fields may explicitly be null; fields prohibited
        for a type must be omitted or null. Unknown fields rejected. Server derives
        identity/time. No Wishlist client events.
    EventReceipt:
      type: object
      required:
      - created
      properties:
        created:
          type: boolean
    BehaviorEvent:
      type: object
      required:
      - id
      - eventType
      - occurredAt
      properties:
        id: *id005
        eventType:
          type: string
          enum: *id006
        productId:
          type:
          - string
          - 'null'
          format: uuid
        searchQuery:
          type:
          - string
          - 'null'
        clientEventId:
          type:
          - string
          - 'null'
          format: uuid
        sourceContext:
          type:
          - string
          - 'null'
          enum:
          - SEARCH_RESULTS
          - CATEGORY_LIST
          - PRODUCT_LIST
          - OTHER
          - null
        occurredAt: *id001
    BehaviorPage:
      type: object
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BehaviorEvent'
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 0
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    ProductCount:
      type: object
      properties:
        productId: *id005
        count:
          type: integer
          format: int64
    SearchCount:
      type: object
      properties:
        query:
          type: string
        count:
          type: integer
          format: int64
    BehaviorOverview:
      type: object
      properties:
        days:
          type: integer
          enum:
          - 7
          - 30
          - 90
        from: *id001
        to: *id001
        counts:
          type: object
          required: *id006
          properties:
            PRODUCT_VIEW:
              type: integer
              format: int64
              minimum: 0
            SEARCH:
              type: integer
              format: int64
              minimum: 0
            PRODUCT_CLICK:
              type: integer
              format: int64
              minimum: 0
            WISHLIST_ADD:
              type: integer
              format: int64
              minimum: 0
            WISHLIST_REMOVE:
              type: integer
              format: int64
              minimum: 0
        mostViewedProducts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductCount'
        mostClickedProducts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductCount'
        popularSearchTerms:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SearchCount'
          description: Normalized terms from at least three distinct Customers; count
            descending, query ascending.
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
