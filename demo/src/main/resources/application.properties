spring.application.name=demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.jpa.hibernate.ddl-auto=validate
# Private product-image bucket. The AWS SDK resolves credentials from its standard
# external provider chain (including AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
catalog.images.bucket=${CATALOG_IMAGE_BUCKET:}
catalog.images.region=${CATALOG_IMAGE_REGION:${AWS_REGION:}}
catalog.images.endpoint=${CATALOG_IMAGE_ENDPOINT:}
