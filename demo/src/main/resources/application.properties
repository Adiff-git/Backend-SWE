spring.application.name=demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
user.lock-timeout-ms=5000
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}

# Internal inference; credentials supplied only by environment.
recommendation.ai.url=${RECOMMENDATION_AI_URL:http://127.0.0.1:8001}
recommendation.ai.key=${RECOMMENDATION_AI_KEY:}
recommendation.ai.connect-timeout-ms=${RECOMMENDATION_AI_CONNECT_TIMEOUT_MS:500}
recommendation.ai.response-timeout-ms=${RECOMMENDATION_AI_RESPONSE_TIMEOUT_MS:3000}
