spring.application.name=demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
user.lock-timeout-ms=5000
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
# Private product-image bucket. Catalog signing uses the configured S3 credential provider.
catalog.images.bucket=${CATALOG_IMAGE_BUCKET:}
catalog.images.region=${CATALOG_IMAGE_REGION:${AWS_REGION:}}
catalog.images.endpoint=${CATALOG_IMAGE_ENDPOINT:}
