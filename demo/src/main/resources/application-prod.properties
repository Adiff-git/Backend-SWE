spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
storage.s3.region=${AWS_REGION}
storage.s3.bucket=${STORAGE_BUCKET}
storage.s3.path-style-access=false
storage.s3.upload-url-lifetime=900s
storage.s3.download-url-lifetime=300s
storage.s3.api-call-timeout=60s
storage.s3.api-call-attempt-timeout=30s

security.identity.enabled=${GOOGLE_ENABLED:false}
security.identity.local=false
security.identity.client-id=${GOOGLE_CLIENT_ID:}
security.identity.client-secret=${GOOGLE_CLIENT_SECRET:}
security.identity.callback-uri=${GOOGLE_CALLBACK_URI:}
security.identity.frontend-success-uri=${GOOGLE_FRONTEND_SUCCESS_URI:}
security.identity.frontend-failure-uri=${GOOGLE_FRONTEND_FAILURE_URI:}
security.identity.allowed-origins=${IDENTITY_ALLOWED_ORIGINS:}
security.identity.proxy.mode=${IDENTITY_FORWARDED_MODE:NONE}
security.identity.proxy.sanitized-ingress=${IDENTITY_SANITIZED_INGRESS:false}
security.verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
security.verification.hmac-key=${VERIFICATION_HMAC_KEY:}
security.verification.encryption-key=${VERIFICATION_ENCRYPTION_KEY:}
security.verification.key-id=${VERIFICATION_KEY_ID:v1}
security.verification.mail-from=${VERIFICATION_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Database constraint diagnostics can include submitted addresses. Use safe identity outcome categories.
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
