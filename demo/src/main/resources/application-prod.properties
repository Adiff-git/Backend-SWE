spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
storage.s3.region=${AWS_REGION}
storage.s3.bucket=${STORAGE_BUCKET}
storage.s3.path-style-access=false
storage.s3.upload-url-lifetime=900s
storage.s3.download-url-lifetime=900s
storage.s3.api-call-timeout=60s
storage.s3.api-call-attempt-timeout=30s
