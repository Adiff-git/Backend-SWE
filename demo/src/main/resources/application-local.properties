spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:backend}
spring.datasource.username=${LOCAL_DB_USER:backend}
spring.datasource.password=${LOCAL_DB_PASSWORD}
storage.s3.region=us-east-1
storage.s3.bucket=${LOCAL_STORAGE_BUCKET:backend-images}
storage.s3.endpoint=${LOCAL_STORAGE_ENDPOINT:http://localhost:4566}
storage.s3.signing-endpoint=${LOCAL_STORAGE_SIGNING_ENDPOINT:http://localhost:4566}
storage.s3.local-access-key=test
storage.s3.local-secret-key=test
storage.s3.path-style-access=true
storage.s3.upload-url-lifetime=900s
storage.s3.download-url-lifetime=300s
storage.s3.api-call-timeout=60s
storage.s3.api-call-attempt-timeout=30s

# Identity features stay disabled until their external credentials and proof keys are supplied.
security.identity.enabled=${GOOGLE_ENABLED:false}
security.identity.local=true
security.identity.client-id=${GOOGLE_CLIENT_ID:}
security.identity.client-secret=${GOOGLE_CLIENT_SECRET:}
security.identity.callback-uri=${GOOGLE_CALLBACK_URI:http://localhost:8080/login/oauth2/code/google}
security.identity.frontend-success-uri=${GOOGLE_FRONTEND_SUCCESS_URI:http://localhost:3000/auth/success}
security.identity.frontend-failure-uri=${GOOGLE_FRONTEND_FAILURE_URI:http://localhost:3000/auth/failure}
security.identity.allowed-origins=${IDENTITY_ALLOWED_ORIGINS:http://localhost:3000}
security.verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
security.verification.hmac-key=${VERIFICATION_HMAC_KEY:}
security.verification.encryption-key=${VERIFICATION_ENCRYPTION_KEY:}
security.verification.key-id=${VERIFICATION_KEY_ID:v1}
security.verification.mail-from=${VERIFICATION_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
