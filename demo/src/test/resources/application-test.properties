# Testcontainers starts a disposable PostgreSQL database; Docker must be running.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///backend_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.secret=${random.uuid}${random.uuid}
security.jwt.issuer=urn:backend-swe:test
security.cors.allowed-origins=http://localhost:3000

security.auth.cleanup.enabled=false
