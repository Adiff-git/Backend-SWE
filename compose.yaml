services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-backend}
      POSTGRES_USER: ${LOCAL_DB_USER:-backend}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in an uncommitted environment file}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-0}
      SNAPSHOT_SAVE_STRATEGY: ON_REQUEST
      SNAPSHOT_LOAD_STRATEGY: ON_STARTUP
      LOCAL_STORAGE_BUCKET: ${LOCAL_STORAGE_BUCKET:-backend-images}
    ports:
      - "127.0.0.1:${LOCAL_STORAGE_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  localstack-data:
